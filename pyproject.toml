[project]
name = "fintech-ai-engineering"
version = "0.1.0"
description = "FinTech AI Engineering & Research Course: Quantitative Feature Engineering, Tabular ML, Deep Learning & Agentic Systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "statsmodels>=0.14.0",
    "scipy>=1.10.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "scikit-learn>=1.3.0",
    "shap>=0.43.0",
    "ipykernel>=6.25.0",
    "jupyterlab>=4.0.0",
    "nbformat>=5.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
